# Server Configuration
server.port=${PORT:8080}

# MongoDB Configuration - Force Cloud/Atlas URI
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:warranty_wallet}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cloudinary Configuration
cloudinary.url=${CLOUDINARY_URL}

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY}

# Upload Directory
upload.dir=./uploads

# JWT Configuration - Strictly load from environment variable
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Application Name
spring.application.name=Warranty Wallet Backend

# Logging
logging.level.com.warrantywalket=DEBUG
