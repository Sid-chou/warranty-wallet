# Server Configuration
server.port=${PORT:8080}

# MongoDB Configuration - Force Cloud/Atlas URI
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:warranty_wallet}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cloudinary Configuration
cloudinary.url=${CLOUDINARY_URL}

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.models=${GEMINI_MODELS:gemini-2.5-flash,gemini-2.5-flash-lite,gemini-2.0-flash}
gemini.retry.max-attempts=${GEMINI_RETRY_MAX_ATTEMPTS:3}
gemini.retry.initial-delay-ms=${GEMINI_RETRY_INITIAL_DELAY_MS:1000}

# Redis / Upstash Configuration
upstash.redis.url=${UPSTASH_REDIS_URL}

# Upload Directory
upload.dir=./uploads

# JWT Configuration - Strictly load from environment variable
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Application Name
spring.application.name=Warranty Wallet Backend

# Logging
logging.level.com.warrantywalket=DEBUG

# Email / SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_EMAIL}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Alert Configuration
alert.days.before=30,7,1

# OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

